<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noema - Feel the Calm</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #f4f7f6; 
            color: #333; 
        }
        .content { 
            text-align: center; 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
        }
        h1 { font-weight: 300; color: #2c3e50; margin-bottom: 10px; }
        p { color: #666; line-height: 1.5; }
        .support-text {
            margin: 20px 0;
            font-size: 0.95em;
            color: #444;
        }
        .links {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        a { 
            color: #007bff; 
            text-decoration: none; 
            font-size: 0.9em; 
            transition: 0.3s; 
        }
        a:hover { text-decoration: underline; }
        .btn {
            border: 1px solid #007bff; 
            padding: 10px 20px; 
            border-radius: 5px;
        }
        .btn:hover {
            background: #007bff;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Noema</h1>
        <p><em>Feel the Calm</em></p>
        
        <div class="support-text">
            Our mission is to make mindfulness a seamless part of everyday life.
            
            Please contact <a href="mailto:smoothchillpill@gmail.com">smoothchillpill@gmail.com</a> for any support or feedback for the Noema - Feel the Calm App.
        </div>

        <p>Newsfeed coming soon.</p>

        <div class="links">
            <a href="privacy-policy" class="btn">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
